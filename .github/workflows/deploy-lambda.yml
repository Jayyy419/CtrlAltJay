name: Deploy to Lambda

# The deploy path for the site. Replaced deploy.yml, which targeted the
# Elastic Beanstalk environment that has since been torn down.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      manage_dns:
        description: >
          Point ctrlaltjay.dev at CloudFront. "false" deploys the stack
          without touching DNS.
        type: choice
        options: ["false", "true"]
        default: "false"

permissions:
  id-token: write
  contents: read

concurrency:
  group: lambda-deploy-prod
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  STACK_NAME: ctrlaltjay-app

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sanity check Python syntax
        run: python3 -m py_compile app.py lambda_handler.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build
        # --use-container so dependencies resolve against the real Lambda
        # runtime image (manylinux wheels for Pillow et al.) rather than
        # whatever happens to match the runner. The function is x86_64, which
        # matches the runner, so this builds natively with no emulation.
        run: sam build --use-container

      - name: Record the current apex before changing DNS
        # Rolling the cutover back is NOT just redeploying with manage_dns
        # false -- that deletes the alias records rather than restoring what
        # was there before. So print the existing apex record set first; this
        # log is the rollback instruction if the cutover has to be undone.
        if: inputs.manage_dns == 'true'
        run: |
          aws route53 list-resource-record-sets \
            --hosted-zone-id Z096666535JC4AOH22XFD \
            --query "ResourceRecordSets[?Name=='ctrlaltjay.dev.']" \
            --output json

      - name: Carry the current on/off state forward
        # A routine deploy must not switch the site back on. SiteEnabled is
        # read from the live stack and passed back explicitly, so a push while
        # the site is deliberately dark leaves it dark. Empty on the first
        # deploy after the parameter is introduced, which correctly means "on".
        id: power
        run: |
          CUR=$(aws cloudformation describe-stacks --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Parameters[?ParameterKey=='SiteEnabled'].ParameterValue" \
            --output text 2>/dev/null || echo "")
          case "$CUR" in true|false) ;; *) CUR=true ;; esac
          echo "site_enabled=${CUR}" >> "$GITHUB_OUTPUT"
          echo "carrying SiteEnabled=${CUR} forward"

      - name: Deploy
        # Cutting the apex over is a deliberate, opt-in step (see
        # docs/lambda-migration.md): manage_dns defaults to false so a routine
        # deploy can never move DNS by itself.
        run: |
          sam deploy \
            --stack-name "${STACK_NAME}" \
            --region "${AWS_REGION}" \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --parameter-overrides \
              ManageDns="${{ inputs.manage_dns || 'false' }}" \
              SiteEnabled="${{ steps.power.outputs.site_enabled }}" \
            --tags Project=CtrlAltJay Environment=Production

      - name: Resolve static bucket
        id: bucket
        run: |
          BUCKET=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_NAME}" \
            --query "Stacks[0].Outputs[?OutputKey=='StaticBucketName'].OutputValue" \
            --output text)
          echo "name=${BUCKET}" >> "$GITHUB_OUTPUT"

      - name: Sync static assets to S3
        # --delete keeps the bucket in step with the repo, but excludes
        # uploads/: those are written at runtime by the admin UI and exist
        # only in S3, so syncing from the repo would delete every one.
        run: |
          aws s3 sync static/ "s3://${{ steps.bucket.outputs.name }}/static/" \
            --delete \
            --exclude "uploads/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront
        run: |
          DIST=$(aws cloudformation describe-stack-resources \
            --stack-name "${STACK_NAME}" \
            --query "StackResources[?ResourceType=='AWS::CloudFront::Distribution'].PhysicalResourceId" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*"
