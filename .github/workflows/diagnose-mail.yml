name: Diagnose the mail failure

# The contact form returns 500 on Elastic Beanstalk -- the request reaches
# Flask and mail.send() raises. That is separate from the CloudFront OAC
# POST problem, and it needs the actual exception rather than a guess.
#
# Invokes the Lambda directly with a synthetic POST event, bypassing
# CloudFront entirely (which is what blocks POSTs), and prints the function
# log tail. app.py logs "Mail error: {e}" on failure, so the exception text
# comes back. Also dumps the EB environment variables to check the mail
# settings are actually present -- names and non-secret values only.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  FUNCTION_NAME: ctrlaltjay-app
  EB_ENV_ID: e-z6u7ybmnth

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: EB mail configuration
        # Confirms whether the secret-resolution chain the app expects is
        # even wired up on EB. MAIL_PASSWORD is redacted below; only the
        # presence of each name matters here.
        run: |
          aws elasticbeanstalk describe-configuration-settings \
            --environment-id "$EB_ENV_ID" \
            --application-name "$(aws elasticbeanstalk describe-environments \
                --environment-ids "$EB_ENV_ID" \
                --query 'Environments[0].ApplicationName' --output text)" \
            --query "ConfigurationSettings[0].OptionSettings[?Namespace=='aws:elasticbeanstalk:application:environment'].OptionName" \
            --output json || echo "DENIED: describe-configuration-settings"

      - name: Invoke the Lambda directly with a contact-form POST
        # Payload format 2.0, matching what a Function URL delivers.
        run: |
          python3 - <<'PY' > /tmp/event.json
          import json, urllib.parse
          form = urllib.parse.urlencode({
              "fullname": "Mail path diagnostic",
              "email": "noreply@ctrlaltjay.dev",
              "subject": "Automated mail diagnostic",
              "reason": "Other",
              "message": "Automated diagnostic invoked directly against the function, bypassing CloudFront, to capture the SMTP error. No reply needed.",
          })
          print(json.dumps({
              "version": "2.0", "rawPath": "/send_message", "rawQueryString": "",
              "headers": {
                  "content-type": "application/x-www-form-urlencoded",
                  "x-requested-with": "XMLHttpRequest",
                  "host": "ctrlaltjay.dev",
              },
              "requestContext": {
                  "http": {"method": "POST", "path": "/send_message",
                           "protocol": "HTTP/1.1", "sourceIp": "127.0.0.1"},
                  "domainName": "ctrlaltjay.dev", "stage": "$default",
              },
              "body": form, "isBase64Encoded": False,
          }))
          PY
          aws lambda invoke --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/event.json \
            --log-type Tail --query LogResult --output text \
            /tmp/out.json > /tmp/log.b64
          echo "== response =="
          cat /tmp/out.json; echo
          echo "== function log =="
          base64 -d /tmp/log.b64 || true
