name: Preflight before EB teardown

# Two jobs, both safe to run repeatedly:
#   contact  - exercises the live contact form, which is the last unproven
#              path on Lambda and the gate on deleting the Secrets Manager
#              entry. Sends one real email.
#   probe    - read-only. Establishes which teardown actions the deploy role
#              can actually perform, so we find out before starting an
#              irreversible sequence rather than halfway through it.

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  DOMAIN: ctrlaltjay.dev
  EB_ENV_ID: e-z6u7ybmnth
  EIP_ALLOC: eipalloc-0153e2c93a05d19ec

jobs:
  contact:
    runs-on: ubuntu-latest
    steps:
      - name: Submit the contact form
        # The route answers JSON when asked as an XHR, and returns 500 with an
        # error body if mail.send() raises. So the response distinguishes "SMTP
        # worked" from "route reachable" -- which a 200 on its own would not.
        # Needs no credentials: this is the public form a visitor uses.
        run: |
          RESP=$(curl -sS -w '\n%{http_code}' --max-time 45 \
            -X POST "https://${DOMAIN}/send_message" \
            -H "X-Requested-With: XMLHttpRequest" \
            --data-urlencode "fullname=Lambda migration check" \
            --data-urlencode "email=noreply@ctrlaltjay.dev" \
            --data-urlencode "subject=Automated post-migration check" \
            --data-urlencode "reason=Other" \
            --data-urlencode "message=Automated check confirming the contact form still sends after the move from Elastic Beanstalk to Lambda. Mail password is read from SSM Parameter Store. No reply needed.")
          BODY=$(echo "$RESP" | head -n -1)
          CODE=$(echo "$RESP" | tail -n 1)
          echo "status=${CODE}"
          echo "body=${BODY}"
          if [ "$CODE" = "429" ]; then
            echo "::warning::rate limited -- inconclusive, not a mail failure"; exit 1
          fi
          test "$CODE" = "200" || { echo "::error::contact form failed (${CODE}) -- SMTP via SSM password is NOT working"; exit 1; }
          echo "$BODY" | grep -q "successfully" || { echo "::error::unexpected body"; exit 1; }
          echo "contact form sent -- SSM mail password path confirmed"

  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Every check is read-only and continues on failure: a denial is the
      # result we are after, not an error to abort on.
      - name: Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk describe-environments --environment-ids "$EB_ENV_ID" \
            --query 'Environments[].{Env:EnvironmentName,Id:EnvironmentId,Status:Status,Health:Health,Stack:SolutionStackName,Cname:CNAME}' \
            --output json || echo "DENIED: elasticbeanstalk:DescribeEnvironments"

      - name: Elastic IP
        # The $3.47/mo line. Note whether it is still associated.
        run: |
          aws ec2 describe-addresses --allocation-ids "$EIP_ALLOC" \
            --query 'Addresses[].{Alloc:AllocationId,Ip:PublicIp,AssocId:AssociationId,Instance:InstanceId}' \
            --output json || echo "DENIED: ec2:DescribeAddresses"

      - name: Can the role release the EIP?
        # Dry run: asks IAM the question without performing the release.
        # Expect either DryRunOperation (allowed) or UnauthorizedOperation.
        run: |
          aws ec2 release-address --allocation-id "$EIP_ALLOC" --dry-run 2>&1 | tail -3 || true

      - name: CloudWatch alarm
        run: |
          aws cloudwatch describe-alarms --alarm-names CtrlAltJay-HighCPU \
            --query 'MetricAlarms[].{Name:AlarmName,State:StateValue,Metric:MetricName}' \
            --output json || echo "DENIED: cloudwatch:DescribeAlarms"

      - name: Secrets Manager entry
        run: |
          aws secretsmanager describe-secret --secret-id ctrlaltjay/mail-password \
            --region "$AWS_REGION" \
            --query '{Name:Name,Rotation:RotationEnabled,Deleted:DeletedDate}' \
            --output json || echo "DENIED: secretsmanager:DescribeSecret"

      - name: SSM write access
        # Needed to land a rotated Anthropic key. Read the parameter's
        # metadata only -- never its value.
        run: |
          aws ssm describe-parameters \
            --parameter-filters "Key=Name,Values=/ctrlaltjay/anthropic-api-key" \
            --query 'Parameters[].{Name:Name,Type:Type,Modified:LastModifiedDate}' \
            --output json || echo "DENIED: ssm:DescribeParameters"

      - name: Cost Explorer
        run: |
          aws ce get-cost-and-usage --region us-east-1 \
            --time-period Start=$(date -u -d '7 days ago' +%Y-%m-%d),End=$(date -u +%Y-%m-%d) \
            --granularity DAILY --metrics UnblendedCost \
            --query 'ResultsByTime[-1].Total' --output json \
            || echo "DENIED: ce:GetCostAndUsage"
