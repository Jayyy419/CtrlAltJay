name: Tear down Elastic Beanstalk

# IRREVERSIBLE. Destroys the old environment and releases the Elastic IP,
# which is what actually stops the billing. Once this runs there is no
# rollback target left: cutover-dns.yml's rollback path points at an IP that
# will no longer be allocated to this account.
#
# Requires confirm="destroy". Ordered so the money stops even if a later step
# fails, and every destructive step is followed by a check that it took
# effect -- a disassociated Elastic IP is still billed, so "released" has to
# be proven rather than assumed.
#
# Deliberately does NOT touch AWS WAF.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to terminate the EB environment and release the Elastic IP.'
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-1
  EB_ENV_ID: e-z6u7ybmnth
  EIP_ALLOC: eipalloc-0153e2c93a05d19ec
  ALARM_NAME: CtrlAltJay-HighCPU
  DOMAIN: ctrlaltjay.dev

jobs:
  teardown:
    if: inputs.confirm == 'destroy'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Refuse if the apex is not already on CloudFront
        # The last safety interlock. Tearing down while DNS still points at
        # Elastic Beanstalk would take the live site down, so this checks
        # where traffic is actually going rather than trusting that the
        # cutover ran.
        run: |
          H=$(curl -sS -o /dev/null -D - --max-time 30 "https://${DOMAIN}/" | tr 'A-Z' 'a-z')
          echo "$H" | grep -q "x-amz-cf-id" \
            || { echo "::error::${DOMAIN} is not being served by CloudFront -- refusing to tear down the rollback"; exit 1; }
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://${DOMAIN}/")
          test "$CODE" = "200" || { echo "::error::${DOMAIN} returned ${CODE} -- refusing"; exit 1; }
          echo "apex is on CloudFront and healthy; proceeding"

      - name: Terminate the Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk terminate-environment --environment-id "$EB_ENV_ID" \
            --query '{Env:EnvironmentName,Status:Status}' --output json

      - name: Wait for termination
        run: |
          for i in $(seq 1 60); do
            S=$(aws elasticbeanstalk describe-environments --environment-ids "$EB_ENV_ID" \
                  --query 'Environments[0].Status' --output text 2>/dev/null || echo "Gone")
            echo "status=${S}"
            case "$S" in
              Terminated|Gone|None) echo "environment terminated"; exit 0 ;;
            esac
            sleep 20
          done
          echo "::warning::still terminating after 20 minutes; continuing to the Elastic IP anyway"

      - name: Release the Elastic IP
        # The $3.47/mo line, and the step most easily got wrong: an unattached
        # Elastic IP is billed MORE than an attached one, so stopping at
        # disassociation would make the bill worse, not better. EB may release
        # it itself during termination, so a missing allocation here is
        # success rather than an error.
        run: |
          if ! aws ec2 describe-addresses --allocation-ids "$EIP_ALLOC" >/dev/null 2>&1; then
            echo "allocation ${EIP_ALLOC} no longer exists -- released during termination"
            exit 0
          fi
          aws ec2 release-address --allocation-id "$EIP_ALLOC"
          echo "release-address returned success"

      - name: Prove the Elastic IP is released, not merely disassociated
        run: |
          if aws ec2 describe-addresses --allocation-ids "$EIP_ALLOC" >/dev/null 2>&1; then
            aws ec2 describe-addresses --allocation-ids "$EIP_ALLOC" --output json
            echo "::error::${EIP_ALLOC} still exists -- it is NOT released and is still being billed"
            exit 1
          fi
          echo "confirmed: ${EIP_ALLOC} no longer exists in this account"

      - name: Delete the CPU alarm
        run: |
          aws cloudwatch delete-alarms --alarm-names "$ALARM_NAME" || echo "::warning::could not delete ${ALARM_NAME}"
          REMAIN=$(aws cloudwatch describe-alarms --alarm-names "$ALARM_NAME" \
                     --query 'length(MetricAlarms)' --output text 2>/dev/null || echo 0)
          echo "alarms remaining with that name: ${REMAIN}"

      - name: Leftovers worth knowing about
        # Anything still standing that carries a cost or needs a manual step.
        run: |
          echo "== EB-owned CloudFormation stacks still present =="
          aws cloudformation describe-stacks \
            --query "Stacks[?starts_with(StackName, 'awseb-')].{Name:StackName,Status:StackStatus}" \
            --output json || true
          echo "== remaining Elastic IPs in this account =="
          aws ec2 describe-addresses \
            --query 'Addresses[].{Alloc:AllocationId,Ip:PublicIp,Assoc:AssociationId}' \
            --output json || true
          echo "== site still healthy after teardown =="
          curl -sS -o /dev/null -w 'status=%{http_code}\n' --max-time 30 "https://${DOMAIN}/"
