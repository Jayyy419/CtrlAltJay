name: Tests

# Runs the suite on every pull request, so a change is checked before it
# merges. Deploys run the same suite again before anything ships.

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install
        run: python3 -m pip install --quiet -r requirements.txt -r requirements-dev.txt

      - name: Tests
        run: python3 tests/run_all.py
