AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CtrlAltJay portfolio — Flask on Lambda behind CloudFront, replacing the
  Elastic Beanstalk environment. CloudFront serves /static/* straight from S3
  and sends everything else to the Lambda Function URL, so the 23MB of images
  and fonts never cost a Lambda invocation.

Parameters:
  DomainName:
    Type: String
    Default: ctrlaltjay.dev
  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:140023398409:certificate/70c4a202-c8ca-4449-9bb2-7e6cbd124cbf
    Description: >
      ACM certificate ARN for DomainName. MUST be in us-east-1 — CloudFront
      only reads certificates from that region regardless of where the rest
      of the stack lives. Defaulted rather than passed as a CI secret: an ARN
      is an identifier, not a credential.
  HostedZoneId:
    Type: String
    Default: Z096666535JC4AOH22XFD
  ManageDns:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Leave "false" for the first deploy so the stack can be verified on its
      CloudFront domain while Elastic Beanstalk still serves live traffic.
      Set "true" to point the apex at CloudFront.
  MailPasswordSsmParam:
    Type: String
    Default: /ctrlaltjay/mail-password
  AnthropicApiKeySsmParam:
    Type: String
    Default: /ctrlaltjay/anthropic-api-key
  SecretKeySsmParam:
    Type: String
    Default: /ctrlaltjay/flask-secret-key
  AdminPasscodeSsmParam:
    Type: String
    Default: /ctrlaltjay/admin-passcode

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    # x86_64 despite arm64 being ~20% cheaper per GB-second. The CI runner is
    # x86_64, so an arm64 build has to run its build container under QEMU
    # emulation — which took >13 minutes without finishing on the first
    # attempt. At this traffic level the whole function sits inside the Lambda
    # free tier, so 20% of ~nothing is not worth an emulated build on every
    # deploy. Revisit only if invocation cost ever becomes material.
    Architectures: [x86_64]
    Runtime: python3.11
    Tags:
      Project: CtrlAltJay
      Environment: Production

Resources:
  # ── Static assets + uploads ────────────────────────────────────────────────
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ctrlaltjay-static-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: Project, Value: CtrlAltJay }
        - { Key: Environment, Value: Production }

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Reachable only through this CloudFront distribution, never directly.
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${StaticBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ── Application ───────────────────────────────────────────────────────────
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlaltjay-app
      CodeUri: ./
      Handler: lambda_handler.handler
      Environment:
        Variables:
          AWS_LAMBDA_REGION_HINT: !Ref AWS::Region
          STATIC_S3_BUCKET: !Ref StaticBucket
          BACKUP_S3_BUCKET: !Ref StaticBucket
          MAIL_SERVER: smtp.office365.com
          MAIL_PORT: "587"
          MAIL_USERNAME: rone_peh@hotmail.com
          MAIL_USE_TLS: "true"
          MAIL_USE_SSL: "false"
          # Secrets are read from SSM at cold start rather than baked in as
          # plaintext environment variables (which is how they were exposed
          # on the old Elastic Beanstalk environment).
          ORIGIN_VERIFY_TOKEN: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
          MAIL_PASSWORD_SSM_PARAM: !Ref MailPasswordSsmParam
          ANTHROPIC_API_KEY_SSM_PARAM: !Ref AnthropicApiKeySsmParam
          SECRET_KEY_SSM_PARAM: !Ref SecretKeySsmParam
          ADMIN_PASSCODE_SSM_PARAM: !Ref AdminPasscodeSsmParam
      FunctionUrlConfig:
        # NONE, not AWS_IAM. CloudFront's OAC does not sign the request body
        # and Lambda function URLs reject UNSIGNED-PAYLOAD, so every POST is
        # refused with a SigV4 signature mismatch under AWS_IAM. GETs work,
        # which is exactly why this survived a GET-only verification pass.
        # The origin is protected by the ORIGIN_VERIFY_TOKEN header instead.
        AuthType: NONE
        InvokeMode: BUFFERED
      Policies:
        - DynamoDBCrudPolicy: { TableName: ctrlaltjay-portfolio-items }
        - DynamoDBCrudPolicy: { TableName: ctrlaltjay-resume-items }
        - DynamoDBCrudPolicy: { TableName: ctrlaltjay-skills }
        - S3CrudPolicy: { BucketName: !Sub "ctrlaltjay-static-${AWS::AccountId}" }
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MailPasswordSsmParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicApiKeySsmParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretKeySsmParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminPasscodeSsmParam}"
            # SecureString values are KMS-encrypted; decrypting them via the
            # AWS-managed SSM key requires this alongside ssm:GetParameter.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # No explicit function-URL permission here. For an AuthType NONE URL, SAM
  # emits both grants itself -- AppFunctionUrlPublicPermissions for
  # lambda:InvokeFunctionUrl and AppFunctionURLInvokeAllowPublicAccess for
  # lambda:InvokeFunction -- so it already covers the October 2025 change that
  # made function URLs need both. Adding a third was redundant, and invalid
  # besides: FunctionUrlAuthType is only accepted on lambda:InvokeFunctionUrl,
  # so pairing it with lambda:InvokeFunction fails the deploy outright.

  # ── Edge ──────────────────────────────────────────────────────────────────
  StaticOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: ctrlaltjay-static-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: CtrlAltJay portfolio
        Aliases: [!Ref DomainName]
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: lambda-origin
            DomainName: !Select [2, !Split ["/", !GetAtt AppFunctionUrl.FunctionUrl]]
            # CloudFront overrides any same-named header the viewer sent, so
            # this cannot be forged by a client -- only by someone who can
            # read the stack. The app 404s anything arriving without it.
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: s3-static-origin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt StaticOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: lambda-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          # CachingDisabled: the app is session-aware (admin cookie) and most
          # routes are dynamic JSON. Caching HTML here would serve one
          # visitor's admin state to another.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader — Function URLs validate the SigV4
          # signature against their own host, so the viewer Host must not be
          # forwarded, but cookies/auth headers must be.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        CacheBehaviors:
          - PathPattern: /static/*
            TargetOriginId: s3-static-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            # CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
      Tags:
        - { Key: Project, Value: CtrlAltJay }
        - { Key: Environment, Value: Production }

  # ── DNS ───────────────────────────────────────────────────────────────────
  # Deliberately NOT created on first deploy — bring the stack up, verify it
  # serves on the CloudFront domain, and only then point the apex at it.
  # Deploy with ManageDns=true once verified.
  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: ManageDnsEnabled
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            # Fixed magic value: the global hosted-zone ID for all CloudFront
            # distributions, not this account's zone.
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

Conditions:
  ManageDnsEnabled: !Equals [!Ref ManageDns, "true"]

Outputs:
  CloudFrontDomain:
    Description: Test URL — verify here before cutting DNS
    Value: !GetAtt CloudFrontDistribution.DomainName
  FunctionUrl:
    Value: !GetAtt AppFunctionUrl.FunctionUrl
  StaticBucketName:
    Value: !Ref StaticBucket
