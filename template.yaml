AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  CtrlAltJay portfolio — Flask on Lambda behind CloudFront, replacing the
  Elastic Beanstalk environment. CloudFront serves /static/* straight from S3
  and sends everything else to the Lambda Function URL, so the 23MB of images
  and fonts never cost a Lambda invocation.

Parameters:
  DomainName:
    Type: String
    Default: ctrlaltjay.dev
  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:140023398409:certificate/70c4a202-c8ca-4449-9bb2-7e6cbd124cbf
    Description: >
      ACM certificate ARN for DomainName. MUST be in us-east-1 — CloudFront
      only reads certificates from that region regardless of where the rest
      of the stack lives. Defaulted rather than passed as a CI secret: an ARN
      is an identifier, not a credential.
  HostedZoneId:
    Type: String
    Default: Z096666535JC4AOH22XFD
  SiteEnabled:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      "false" takes the whole site out of public view: every request, for
      every path and method, is answered at the edge by the OfflinePage
      function with a 503 holding page, so nothing reaches the function or
      S3. Nothing is destroyed -- DynamoDB, S3 and the function are
      untouched -- so setting it back to "true" restores the site exactly as
      it was. The distribution itself stays enabled either way. Disabling it
      left ctrlaltjay.dev with no TLS endpoint: the apex alias resolved to
      nothing, and any resolver or cache that filled the gap handed browsers
      a certificate for some other name. On an HSTS-preloaded .dev domain
      that is an unbypassable "connection is not secure" error.

  ManageDns:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Leave "false" for the first deploy so the stack can be verified on its
      CloudFront domain while Elastic Beanstalk still serves live traffic.
      Set "true" to point the apex at CloudFront.
  MailPasswordSsmParam:
    Type: String
    Default: /ctrlaltjay/mail-password
  AnthropicApiKeySsmParam:
    Type: String
    Default: /ctrlaltjay/anthropic-api-key
  SecretKeySsmParam:
    Type: String
    Default: /ctrlaltjay/flask-secret-key
  AdminPasscodeSsmParam:
    Type: String
    Default: /ctrlaltjay/admin-passcode

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    # x86_64 despite arm64 being ~20% cheaper per GB-second. The CI runner is
    # x86_64, so an arm64 build has to run its build container under QEMU
    # emulation — which took >13 minutes without finishing on the first
    # attempt. At this traffic level the whole function sits inside the Lambda
    # free tier, so 20% of ~nothing is not worth an emulated build on every
    # deploy. Revisit only if invocation cost ever becomes material.
    Architectures: [x86_64]
    Runtime: python3.11
    Tags:
      Project: CtrlAltJay
      Environment: Production

Resources:
  # ── Static assets + uploads ────────────────────────────────────────────────
  StaticBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "ctrlaltjay-static-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - { Key: Project, Value: CtrlAltJay }
        - { Key: Environment, Value: Production }

  StaticBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StaticBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Reachable only through this CloudFront distribution, never directly.
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${StaticBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # ── Application ───────────────────────────────────────────────────────────
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ctrlaltjay-app
      CodeUri: ./
      Handler: lambda_handler.handler
      Environment:
        Variables:
          AWS_LAMBDA_REGION_HINT: !Ref AWS::Region
          STATIC_S3_BUCKET: !Ref StaticBucket
          BACKUP_S3_BUCKET: !Ref StaticBucket
          # SES rather than SMTP: Microsoft disabled basic authentication on
          # the Office365 mailbox, so the SMTP path fails with 535 5.7.139 no
          # matter what password is supplied. Sending as the domain means no
          # credential is involved at all.
          SES_SENDER: !Sub "no-reply@${DomainName}"
          MAIL_SERVER: smtp.office365.com
          MAIL_PORT: "587"
          MAIL_USERNAME: rone_peh@hotmail.com
          MAIL_USE_TLS: "true"
          MAIL_USE_SSL: "false"
          # Secrets are read from SSM at cold start rather than baked in as
          # plaintext environment variables (which is how they were exposed
          # on the old Elastic Beanstalk environment).
          ORIGIN_VERIFY_TOKEN: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
          MAIL_PASSWORD_SSM_PARAM: !Ref MailPasswordSsmParam
          ANTHROPIC_API_KEY_SSM_PARAM: !Ref AnthropicApiKeySsmParam
          SECRET_KEY_SSM_PARAM: !Ref SecretKeySsmParam
          ADMIN_PASSCODE_SSM_PARAM: !Ref AdminPasscodeSsmParam
      FunctionUrlConfig:
        # NONE, not AWS_IAM. CloudFront's OAC does not sign the request body
        # and Lambda function URLs reject UNSIGNED-PAYLOAD, so every POST is
        # refused with a SigV4 signature mismatch under AWS_IAM. GETs work,
        # which is exactly why this survived a GET-only verification pass.
        # The origin is protected by the ORIGIN_VERIFY_TOKEN header instead.
        AuthType: NONE
        InvokeMode: BUFFERED
      Policies:
        - DynamoDBCrudPolicy: { TableName: ctrlaltjay-portfolio-items }
        - DynamoDBCrudPolicy: { TableName: ctrlaltjay-resume-items }
        - DynamoDBCrudPolicy: { TableName: ctrlaltjay-skills }
        - S3CrudPolicy: { BucketName: !Sub "ctrlaltjay-static-${AWS::AccountId}" }
        - Statement:
            - Effect: Allow
              Action: [ses:SendEmail, ses:SendRawEmail]
              Resource: "*"
              Condition:
                StringEquals:
                  # Restricts sending to this one From address, so the
                  # permission cannot be used to send as any other verified
                  # identity in the account.
                  ses:FromAddress: !Sub "no-reply@${DomainName}"
        - Statement:
            - Effect: Allow
              Action: [ssm:GetParameter, ssm:GetParameters]
              Resource:
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${MailPasswordSsmParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AnthropicApiKeySsmParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SecretKeySsmParam}"
                - !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${AdminPasscodeSsmParam}"
            # SecureString values are KMS-encrypted; decrypting them via the
            # AWS-managed SSM key requires this alongside ssm:GetParameter.
            - Effect: Allow
              Action: kms:Decrypt
              Resource: "*"
              Condition:
                StringEquals:
                  kms:ViaService: !Sub "ssm.${AWS::Region}.amazonaws.com"

  # No explicit function-URL permission here. For an AuthType NONE URL, SAM
  # emits both grants itself -- AppFunctionUrlPublicPermissions for
  # lambda:InvokeFunctionUrl and AppFunctionURLInvokeAllowPublicAccess for
  # lambda:InvokeFunction -- so it already covers the October 2025 change that
  # made function URLs need both. Adding a third was redundant, and invalid
  # besides: FunctionUrlAuthType is only accepted on lambda:InvokeFunctionUrl,
  # so pairing it with lambda:InvokeFunction fails the deploy outright.

  # ── Edge ──────────────────────────────────────────────────────────────────
  StaticOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: ctrlaltjay-static-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Holds the owner preview secret. Written only by the "Owner preview link"
  # workflow, which mints a new value each run -- so minting a link revokes
  # the previous one. Starts empty, and an empty or short value unlocks
  # nothing.
  PreviewStore:
    Type: AWS::CloudFront::KeyValueStore
    Properties:
      Name: !Sub "${AWS::StackName}-preview"
      Comment: Owner preview secret for the CtrlAltJay holding page

  # Holding page served while SiteEnabled is "false". Answers at the edge,
  # before any origin, so with it attached nothing reaches the function or
  # S3 -- the site is dark -- while the domain keeps a valid certificate.
  # The one exception is the owner: a browser that opened the current
  # preview link carries a cookie matching PreviewStore and is let through
  # to the real site, admin panel included (which still needs the admin
  # passcode). It is only attached when the site is off; the function
  # itself costs nothing while unattached.
  OfflinePage:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-offline"
      AutoPublish: true
      FunctionConfig:
        Comment: CtrlAltJay holding page while the site is switched off
        Runtime: cloudfront-js-2.0
        KeyValueStoreAssociations:
          - KeyValueStoreARN: !GetAtt PreviewStore.Arn
      FunctionCode: |
        import cf from 'cloudfront';

        var kvs = cf.kvs();
        var COOKIE = 'cajpreview';
        var PAGE = '<!doctype html><html lang="en" data-ctrlaltjay-offline><head>' +
          '<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
          '<meta name="robots" content="noindex"><title>ctrlaltjay.dev</title><style>' +
          ':root{color-scheme:light dark}' +
          'body{margin:0;min-height:100vh;display:grid;place-items:center;' +
          'font:16px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif;' +
          'background:#fafaf9;color:#1c1917}' +
          '@media (prefers-color-scheme:dark){body{background:#0c0a09;color:#e7e5e4}}' +
          'main{padding:2rem;text-align:center}' +
          'h1{font:600 1.1rem ui-monospace,SFMono-Regular,Menlo,monospace;margin:0 0 .5rem}' +
          'p{margin:0;opacity:.7}</style></head><body><main>' +
          '<h1>ctrlaltjay.dev</h1><p>Offline for now. Check back soon.</p>' +
          '</main></body></html>';

        function offline() {
          return {
            statusCode: 503,
            statusDescription: 'Service Unavailable',
            headers: {
              'content-type': { value: 'text/html; charset=utf-8' },
              'cache-control': { value: 'no-store' },
              'retry-after': { value: '86400' },
              'x-robots-tag': { value: 'noindex' }
            },
            body: PAGE
          };
        }

        async function handler(event) {
          var req = event.request;
          var secret = '';
          try { secret = await kvs.get('preview-token'); } catch (e) { secret = ''; }
          // Nothing minted yet, or a value too short to be one we wrote:
          // everyone gets the holding page.
          if (!secret || secret.length < 32) return offline();

          var q = req.querystring.preview;
          if (q && q.value === secret) {
            // Trade the link for a cookie and drop the secret from the
            // address bar.
            return {
              statusCode: 302,
              statusDescription: 'Found',
              headers: {
                'location': { value: req.uri },
                'cache-control': { value: 'no-store' }
              },
              cookies: {
                'cajpreview': {
                  value: secret,
                  attributes: 'Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=2592000'
                }
              }
            };
          }
          var c = req.cookies[COOKIE];
          if (c && c.value === secret) return req;
          return offline();
        }

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        # Always on -- see SiteEnabled. "Off" is the OfflinePage function.
        Enabled: true
        Comment: CtrlAltJay portfolio
        Aliases: [!Ref DomainName]
        PriceClass: PriceClass_All
        HttpVersion: http2and3
        IPV6Enabled: true
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: lambda-origin
            DomainName: !Select [2, !Split ["/", !GetAtt AppFunctionUrl.FunctionUrl]]
            # CloudFront overrides any same-named header the viewer sent, so
            # this cannot be forged by a client -- only by someone who can
            # read the stack. The app 404s anything arriving without it.
            OriginCustomHeaders:
              - HeaderName: x-origin-verify
                HeaderValue: !Select [2, !Split ["/", !Ref "AWS::StackId"]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
          - Id: s3-static-origin
            DomainName: !GetAtt StaticBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt StaticOAC.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: lambda-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          # CachingDisabled: the app is session-aware (admin cookie) and most
          # routes are dynamic JSON. Caching HTML here would serve one
          # visitor's admin state to another.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # AllViewerExceptHostHeader — Function URLs validate the SigV4
          # signature against their own host, so the viewer Host must not be
          # forwarded, but cookies/auth headers must be.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          FunctionAssociations: !If
            - SiteOff
            - - EventType: viewer-request
                FunctionARN: !GetAtt OfflinePage.FunctionARN
            - !Ref AWS::NoValue
        CacheBehaviors:
          - PathPattern: /static/*
            TargetOriginId: s3-static-origin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            # CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            FunctionAssociations: !If
              - SiteOff
              - - EventType: viewer-request
                  FunctionARN: !GetAtt OfflinePage.FunctionARN
              - !Ref AWS::NoValue
      Tags:
        - { Key: Project, Value: CtrlAltJay }
        - { Key: Environment, Value: Production }

  # ── DNS ───────────────────────────────────────────────────────────────────
  # Deliberately NOT created on first deploy — bring the stack up, verify it
  # serves on the CloudFront domain, and only then point the apex at it.
  # Deploy with ManageDns=true once verified.
  ApexRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: ManageDnsEnabled
    Properties:
      HostedZoneId: !Ref HostedZoneId
      RecordSets:
        - Name: !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            # Fixed magic value: the global hosted-zone ID for all CloudFront
            # distributions, not this account's zone.
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt CloudFrontDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

Conditions:
  ManageDnsEnabled: !Equals [!Ref ManageDns, "true"]
  SiteOff: !Equals [!Ref SiteEnabled, "false"]

Outputs:
  CloudFrontDomain:
    Description: Test URL — verify here before cutting DNS
    Value: !GetAtt CloudFrontDistribution.DomainName
  FunctionUrl:
    Value: !GetAtt AppFunctionUrl.FunctionUrl
  StaticBucketName:
    Value: !Ref StaticBucket
  PreviewStoreArn:
    Description: Read by the "Owner preview link" workflow
    Value: !GetAtt PreviewStore.Arn
